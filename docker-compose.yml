services:
  # Postgres with the pgvector extension. Not used by the Phase 0 path yet,
  # but the skeleton is here so Phase 1 is a drop-in.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DATABASE_URL: postgresql://finsight:finsight@db:5432/finsight
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
